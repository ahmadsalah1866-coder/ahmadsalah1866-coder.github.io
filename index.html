<html lang="en">
<head>

<title>Ahmad Al-Remawi | Ali &amp; Sons Contracting</title>
<meta name="theme-color" content="#14213d">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#eef1f6;color:#111a2e;padding:24px 16px 40px}
.card{max-width:460px;margin:0 auto;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(20,33,61,.12)}
.head{background:#c9d6e8;padding:30px 20px 26px;text-align:center}
.logo{width:130px;height:98px;background:#fff;border-radius:22px;margin:0 auto 18px;display:grid;place-items:center;overflow:hidden}
.logo img{max-width:85%;max-height:85%;object-fit:contain}
h1{margin:0;font-size:30px;font-weight:800}
.company{margin:10px 0 0;font-size:14px;font-weight:800;color:#1f5fbf;letter-spacing:.3px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 10px;border-radius:16px;font-weight:700;font-size:17px;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn svg{width:22px;height:22px}
.call{background:#1565c0;color:#fff}
.wa{background:#1f9d55;color:#fff}
.light{background:#edf2fa;color:#1565c0}
.wide{grid-column:1/-1;background:#14213d;color:#fff}
.details{padding:0 26px 22px}
.item{display:grid;grid-template-columns:90px 1fr;gap:8px;padding:16px 0;border-bottom:1px solid #e3e7ee}
.item:last-child{border-bottom:0}
.label{color:#5b6578;font-weight:600}
.value{color:#1565c0;text-decoration:none;word-break:break-word}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.65);display:none;place-items:center;padding:20px}
.modal:target{display:grid}
.sheet{background:#fff;border-radius:22px;padding:24px;text-align:center;width:100%;max-width:320px}
.sheet svg{display:block;margin:0 auto;width:220px;height:220px}
