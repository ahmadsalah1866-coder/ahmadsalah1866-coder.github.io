<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eng. Ahmad Alremawi – Ali &amp; Sons Contracting</title>
<meta name="description" content="Digital business card – Eng. Ahmad Alremawi, Ali &amp; Sons Contracting">
<meta name="theme-color" content="#1e1e1e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#eef1f6; --card:#ffffff; --head:#c9d6e8; --ink:#111a2e; --muted:#5b6578;
    --blue:#1565c0; --brand:#1f5fbf; --green:#1f9d55; --soft:#edf2fa; --dark:#14213d;
    --line:#e3e7ee; --shadow:0 10px 30px rgba(20,33,61,.12);
  }
  body.dark{
    --bg:#0d1117; --card:#161b22; --head:#1f3a5f; --ink:#e8edf5; --muted:#9aa5b8;
    --soft:#1f2733; --dark:#2d4b80; --line:#2a313c; --brand:#6ea8ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);
       transition:background .3s,color .3s;min-height:100vh;padding:24px 16px 40px}
  .card{max-width:460px;margin:0 auto;background:var(--card);border-radius:28px;overflow:hidden;
        box-shadow:var(--shadow);animation:rise .6s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .head{background:var(--head);padding:30px 20px 26px;margin-bottom:8px;text-align:center;position:relative}
  .logo{width:130px;height:98px;background:#fff;border-radius:22px;margin:0 auto 18px;display:grid;
        place-items:center;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .logo img{max-width:85%;max-height:85%;object-fit:contain}
  .logo .fallback{font-weight:800;font-size:28px;color:#0d6fb8;letter-spacing:1px}
  h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.5px}
  .role{margin:6px 0 10px;font-size:17px;font-weight:600;color:var(--muted)}
  .company{margin:0;font-size:14px;font-weight:800;color:var(--brand);letter-spacing:.3px}
  .toggle{position:absolute;top:14px;right:14px;border:0;background:rgba(255,255,255,.55);
          width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:17px}
  body.dark .toggle{background:rgba(0,0,0,.3)}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 22px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 10px;border-radius:16px;
       font-weight:700;font-size:17px;text-decoration:none;border:0;cursor:pointer;font-family:inherit;
       transition:transform .12s,filter .2s}
  .btn:active{transform:scale(.96)}
  .btn:hover{filter:brightness(1.07)}
  .btn svg{width:22px;height:22px}
  .call{background:var(--blue);color:#fff}
  .wa{background:var(--green);color:#fff}
  .light{background:var(--soft);color:var(--blue)}
  body.dark .light{color:#8fbaff}
  .wide{grid-column:1/-1;background:var(--dark);color:#fff}
  .row3{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3 .btn{font-size:15px;padding:13px 8px}
  .details{padding:6px 26px 22px}
  .item{display:grid;grid-template-columns:96px 1fr auto;align-items:start;gap:8px;padding:16px 0;
        border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .label{color:var(--muted);font-weight:600;font-size:15px}
  .value{color:var(--blue);font-size:16px;text-decoration:none;word-break:break-word;line-height:1.45}
  body.dark .value{color:#8fbaff}
  .value.plain{color:var(--ink)}
  .copy{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px 4px;border-radius:8px}
  .copy:hover{background:var(--soft)}
  .copy svg{width:18px;height:18px}
  .foot{text-align:center;color:var(--muted);font-size:12px;padding:0 0 20px}
  .modal{position:fixed;inset:0;background:rgba(10,15,25,.6);display:none;place-items:center;z-index:9;padding:20px}
  .modal.open{display:grid;animation:fade .2s}
  @keyframes fade{from{opacity:0}}
  .sheet{background:var(--card);border-radius:22px;padding:24px;text-align:center;max-width:320px;width:100%}
  .sheet h3{margin:0 0 4px}
  .sheet p{margin:0 0 16px;color:var(--muted);font-size:14px}
  #qr{display:inline-block;padding:12px;background:#fff;border-radius:14px}
  .sheet .btn{margin-top:16px;width:100%}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,40px);background:var(--dark);color:#fff;
         padding:12px 20px;border-radius:30px;font-size:14px;font-weight:600;opacity:0;transition:.3s;z-index:10}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main class="card">
  <section class="head">
    <button class="toggle" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
    <div class="logo">
      <img src="https://cdn.prod.website-files.com/6538a7ad52c9d823231bd186/6552fce82bac6240fbcf31e7_asc256.png" alt="Ali &amp; Sons Contracting logo"
           onerror="if(!this.dataset.f){this.dataset.f=1;this.src='logo.png'}else{this.replaceWith(Object.assign(document.createElement('span'),{className:'fallback',textContent:'ASC'}))}">
    </div>
    <h1>Eng. Ahmad Alremawi</h1>
    <p class="role" id="roleLine"></p>
    <p class="company">ALI &amp; SONS CONTRACTING</p>
  </section>
  <section class="actions">
    <a class="btn call" id="callBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
      Call</a>
    <a class="btn wa" id="waBtn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
      WhatsApp</a>
    <a class="btn light" id="mailBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
      Email</a>
    <a class="btn light" id="webBtn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
      Website</a>
    <button class="btn wide" id="saveBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      Save contact</button>
    <div class="row3">
      <button class="btn light" id="shareBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
        Share</button>
      <button class="btn light" id="qrBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 17h4v4"/></svg>
        QR code</button>
    </div>
